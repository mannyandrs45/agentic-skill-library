<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img">
  <title>Three-layer skill library architecture</title>
  <desc>Skills are indexed into one catalog and supported by a maintenance layer.</desc>
  <rect width="1200" height="420" fill="#F3EFE5"/>
  <text x="64" y="56" fill="#272826" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700">One library, three layers</text>
  <text x="64" y="84" fill="#6A6B67" font-family="DejaVu Sans, sans-serif" font-size="15">The shortest path from discovery to an executable workflow.</text>
  <line x1="64" y1="108" x2="1136" y2="108" stroke="#A7A49C" stroke-width="1"/>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="64" y="151" fill="#8C3F2B" font-size="13" font-weight="700">01</text>
    <text x="112" y="151" fill="#272826" font-size="20" font-weight="700">SKILLS</text>
    <text x="300" y="151" fill="#555753" font-size="16">Every runnable workflow</text>
    <text x="700" y="151" fill="#272826" font-family="DejaVu Sans Mono, monospace" font-size="14">skills/community/</text>
    <text x="940" y="151" fill="#777873" font-size="14">80 upstream</text>
    <text x="700" y="181" fill="#272826" font-family="DejaVu Sans Mono, monospace" font-size="14">skills/personal/</text>
    <text x="940" y="181" fill="#777873" font-size="14">48 personal</text>
    <line x1="64" y1="212" x2="1136" y2="212" stroke="#C9C4B9" stroke-width="1"/>

    <text x="64" y="255" fill="#8C3F2B" font-size="13" font-weight="700">02</text>
    <text x="112" y="255" fill="#272826" font-size="20" font-weight="700">CATALOG</text>
    <text x="300" y="255" fill="#555753" font-size="16">One index, two formats</text>
    <text x="700" y="255" fill="#272826" font-family="DejaVu Sans Mono, monospace" font-size="14">CATALOG.md</text>
    <text x="940" y="255" fill="#777873" font-size="14">human</text>
    <text x="700" y="285" fill="#272826" font-family="DejaVu Sans Mono, monospace" font-size="14">registry/catalog.json</text>
    <text x="940" y="285" fill="#777873" font-size="14">machine</text>
    <line x1="64" y1="316" x2="1136" y2="316" stroke="#C9C4B9" stroke-width="1"/>

    <text x="64" y="359" fill="#8C3F2B" font-size="13" font-weight="700">03</text>
    <text x="112" y="359" fill="#272826" font-size="20" font-weight="700">MAINTAIN</text>
    <text x="300" y="359" fill="#555753" font-size="16">Provenance and checks</text>
    <text x="700" y="359" fill="#272826" font-family="DejaVu Sans Mono, monospace" font-size="14">registry/</text>
    <text x="940" y="359" fill="#777873" font-size="14">sources · policy</text>
    <text x="700" y="389" fill="#272826" font-family="DejaVu Sans Mono, monospace" font-size="14">scripts/</text>
    <text x="940" y="389" fill="#777873" font-size="14">sync · validate</text>
  </g>
</svg>
