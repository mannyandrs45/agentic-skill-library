<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img">
  <title>Three-layer skill library architecture</title>
  <desc>All community and personal skills are indexed into one catalog and maintained by a small registry and scripts layer.</desc>
  <rect width="1200" height="430" fill="#F3EFE5"/>
  <text x="64" y="60" fill="#272826" font-family="Georgia, Times New Roman, serif" font-size="28">One library, three layers</text>
  <text x="64" y="88" fill="#6A6B67" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">The shortest path from discovery to an executable workflow.</text>
  <line x1="64" y1="116" x2="1136" y2="116" stroke="#A7A49C" stroke-width="1"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="64" y="158" fill="#8C3F2B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">01</text>
    <text x="64" y="196" fill="#272826" font-family="Georgia, Times New Roman, serif" font-size="27">Skills</text>
    <text x="64" y="228" fill="#555753" font-size="16">Every runnable workflow</text>
    <line x1="64" y1="251" x2="330" y2="251" stroke="#C9C4B9"/>
    <text x="64" y="284" fill="#272826" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">skills/community/</text>
    <text x="64" y="311" fill="#777873" font-size="14">80 attributed upstream skills</text>
    <text x="64" y="347" fill="#272826" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">skills/personal/</text>
    <text x="64" y="374" fill="#777873" font-size="14">48 Perplexity exports</text>

    <line x1="366" y1="242" x2="418" y2="242" stroke="#555753" stroke-width="1.5"/>
    <path d="M410 235l8 7-8 7" fill="none" stroke="#555753" stroke-width="1.5"/>

    <text x="454" y="158" fill="#8C3F2B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">02</text>
    <text x="454" y="196" fill="#272826" font-family="Georgia, Times New Roman, serif" font-size="27">Catalog</text>
    <text x="454" y="228" fill="#555753" font-size="16">One index, two formats</text>
    <line x1="454" y1="251" x2="720" y2="251" stroke="#C9C4B9"/>
    <text x="454" y="284" fill="#272826" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">CATALOG.md</text>
    <text x="454" y="311" fill="#777873" font-size="14">Human discovery</text>
    <text x="454" y="347" fill="#272826" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">registry/catalog.json</text>
    <text x="454" y="374" fill="#777873" font-size="14">Machine discovery</text>

    <line x1="756" y1="242" x2="808" y2="242" stroke="#555753" stroke-width="1.5"/>
    <path d="M800 235l8 7-8 7" fill="none" stroke="#555753" stroke-width="1.5"/>

    <text x="844" y="158" fill="#8C3F2B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">03</text>
    <text x="844" y="196" fill="#272826" font-family="Georgia, Times New Roman, serif" font-size="27">Maintenance</text>
    <text x="844" y="228" fill="#555753" font-size="16">Provenance and checks</text>
    <line x1="844" y1="251" x2="1136" y2="251" stroke="#C9C4B9"/>
    <text x="844" y="284" fill="#272826" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">registry/</text>
    <text x="844" y="311" fill="#777873" font-size="14">Sources · licenses · policy</text>
    <text x="844" y="347" fill="#272826" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">scripts/</text>
    <text x="844" y="374" fill="#777873" font-size="14">Import · sync · validate</text>
  </g>
</svg>
